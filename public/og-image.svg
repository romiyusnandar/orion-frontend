<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="blob" cx="0.82" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#c7d2fe" stop-opacity="0.85"/><stop offset="1" stop-color="#c7d2fe" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#18181b" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="url(#blob)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- logo mark -->
  <g transform="translate(545,80)">
    <rect width="110" height="110" rx="28" fill="url(#star)"/>
    <path d="M55 10 C58 45 70 58 105 55 C70 62 58 74 55 105 C52 74 40 62 5 55 C40 58 52 45 55 10 Z" fill="#ffffff"/>
  </g>

  <text x="600" y="320" text-anchor="middle" font-family="Inter,'DejaVu Sans',Arial,sans-serif" font-size="96" font-weight="800" fill="#18181b">Orion <tspan fill="url(#txt)">OS</tspan></text>
  <text x="600" y="392" text-anchor="middle" font-family="Inter,'DejaVu Sans',Arial,sans-serif" font-size="52" font-weight="700" fill="url(#txt)">Pure Performance.</text>
  <text x="600" y="452" text-anchor="middle" font-family="Inter,'DejaVu Sans',Arial,sans-serif" font-size="30" font-weight="500" fill="#52525b">Lightweight, secure &amp; minimal Android</text>

  <text x="600" y="572" text-anchor="middle" font-family="Inter,'DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="600" fill="#71717a">orionos-project.com</text>
</svg>
